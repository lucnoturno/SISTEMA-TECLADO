name: build
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Baixar modelo e amostras
        run: python download_assets.py

      - name: Compilar com PyInstaller
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          pyinstaller --noconfirm --clean PianoVideo.spec

      - name: Gerar instalador (Inno Setup)
        run: |
          if (!(Test-Path installer_windows.iss)) { Copy-Item installer_windows.iss.exe installer_windows.iss }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer_windows.iss

      - uses: actions/upload-artifact@v4
        with:
          name: PianoVideo-Windows-Setup
          path: Output/PianoVideo-Setup.exe
